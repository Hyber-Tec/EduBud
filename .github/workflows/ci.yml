# Checks every pull request before it can reach main, and main after each merge. Then Hosting: main deploys to
# https://edubud-hybertec.web.app, and a pull request from this repository gets a preview link for 7 days.
# Written as if the repository were private (Hyber-Tec's rules for GitHub Actions; docs/DEPLOY.md, "What CI checks"):
# one job checks, and only what a change touches (scripts/ci-changes.sh); the deploy runs apart, with its own
# permissions, and only when Hosting changed. A change to the docs alone runs the repository guard and deploys nothing.
# No keys: the deploy signs in to Google Cloud through Workload Identity Federation (docs/DEPLOY.md), as
# github-deploy@ for main and github-preview@ (Hosting only) for pull requests. The ruleset on main requires the check
# job by name ("Checks"). The deploy also gets the Instagram feed's newest posts (docs/INSTAGRAM.md); the Instagram
# workflow starts a run on main when there are new ones.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on main (or by the Instagram workflow, for new posts), it checks and deploys everything.
  workflow_dispatch:

# A new push to the same pull request cancels the run still going for the previous push; runs on main queue, so they
# deploy in the order they were merged.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      code: ${{ steps.changes.outputs.code }}
      hosting: ${{ steps.changes.outputs.hosting }}
    steps:
      # The commit and its parent: enough to list the changed files (a push to main is one squashed commit); when it
      # isn't, scripts/ci-changes.sh checks and deploys everything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: No people's data or secrets in the repository
        run: bash scripts/check-repo.sh

      # Its summary says what it found, and why.
      - name: What this change needs checked and deployed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-changes.sh

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22

      # The website's packages, kept between runs by its lock file, so a run whose lock file didn't change skips
      # `npm ci`.
      - name: The website's packages
        if: steps.changes.outputs.code == 'true'
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            web/node_modules
            !web/node_modules/.vite
          key: modules-web-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('web/package-lock.json') }}

      - name: Install
        if: steps.changes.outputs.code == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefix web

      - name: Typecheck and build the website
        if: steps.changes.outputs.code == 'true'
        run: npm --prefix web run typecheck && npm --prefix web run build

  deploy:
    name: Deploy
    needs: check
    # main: live. A pull request: its preview, only from a branch of this repository (a fork's run gets no sign-in).
    if: >-
      needs.check.outputs.hosting == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.event.pull_request.number || 'live' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The website is built again here, from the same commit (a few seconds), rather than handed over as an artifact:
      # its pictures make it a few hundred MB.
      - name: The website's packages
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            web/node_modules
            !web/node_modules/.vite
          key: modules-web-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('web/package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefix web

      # Before the build: main's also reads Instagram's token from Secret Manager for the next step.
      - name: Sign in to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/257015720209/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ${{ github.event_name == 'pull_request' && 'github-preview' || 'github-deploy' }}@edubud-hybertec.iam.gserviceaccount.com
          token_format: ${{ github.event_name != 'pull_request' && 'access_token' || '' }}

      # Once EduBud's account is connected (docs/INSTAGRAM.md): main's deploy reads the newest posts and their pictures
      # from Instagram, so a merge never drops them; a preview copies the live website's. If neither can be read, or
      # before the account is connected, the website shows the posts read from the original.
      - name: The Instagram feed
        if: vars.INSTAGRAM_FEED == 'on'
        env:
          INSTAGRAM: ${{ github.event_name != 'pull_request' && 'on' || '' }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node web/scripts/instagram.mjs build

      # main's build gets EduBud's Google Maps key (a browser key that only works on EduBud's addresses, so the map is
      # Google's map code as on the original); a pull request's preview isn't one of those addresses and keeps the
      # keyless embed.
      - name: Build the website
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: npm --prefix web run build

      - name: The Firebase CLI
        uses: actions/cache@v6
        with:
          path: ~/.npm/_npx
          key: npx-firebase-tools-15.32.1-${{ runner.os }}-${{ runner.arch }}

      - name: Deploy to https://edubud-hybertec.web.app
        if: github.event_name != 'pull_request'
        run: npx --yes firebase-tools@15.32.1 deploy --only hosting --project edubud-hybertec --non-interactive

      # One comment per pull request, updated on each push.
      - name: The pull request's preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes firebase-tools@15.32.1 hosting:channel:deploy "pr-$PR" --expires 7d --project edubud-hybertec --non-interactive --json > channel.json
          url=$(node -p 'Object.values(require("./channel.json").result)[0].url')
          body="**Preview:** $url (for \`${SHA:0:7}\`, kept 7 days after the last push)"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"
