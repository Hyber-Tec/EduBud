<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>EduBud</title>
  <style>
    :root { color-scheme: light dark; --ink: hsl(63 61% 7%); --paper: #fff; --mint: hsl(158 85% 54%); }
    @media (prefers-color-scheme: dark) { :root { --ink: #f4f4f2; --paper: hsl(63 61% 7%); } }
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
    body { display: grid; place-items: center; font: 300 1.125rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; padding: 2rem 1.25rem; }
    h1 { font-weight: 700; font-size: 1.75rem; margin: 0 0 .5rem; }
    h1::after { content: ""; display: block; width: 3rem; height: .3rem; margin-top: .75rem; border-radius: 1rem; background: var(--mint); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>EduBud</h1>
    <p>Our copy of <a href="https://www.edubud.org">edubud.org</a> is being built here. Until it is ready, please visit
      <a href="https://www.edubud.org">edubud.org</a>.</p>
  </main>
</body>
</html>
